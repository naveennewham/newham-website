  <circle cx="30" cy="30" r="25" fill="#0891b2" opacity="0.1"/>
  
  <!-- Icon: People/workforce with organizational structure -->
  <circle cx="30" cy="20" r="5" fill="#22d3ee"/>
  <path d="M 30 25 L 30 30" stroke="#22d3ee" stroke-width="2"/>
