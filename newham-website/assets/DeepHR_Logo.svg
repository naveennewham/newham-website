  <path d="M 20 42 L 20 48" stroke="#22d3ee" stroke-width="1.5"/>
  <path d="M 40 42 L 40 48" stroke="#22d3ee" stroke-width="1.5"/>
  
  <!-- Connection lines -->
  <line x1="15" y1="48" x2="25" y2="48" stroke="#22d3ee" stroke-width="1.5"/>
  <line x1="35" y1="48" x2="45" y2="48" stroke="#22d3ee" stroke-width="1.5"/>
  
  <!-- Text: DeepHR -->
  <text x="65" y="28" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#22d3ee">Deep</text>
  <text x="115" y="28" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0891b2">HR</text>
  <text x="65" y="45" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8">Workforce Management</text>
