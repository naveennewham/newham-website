<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="30" cy="30" r="25" fill="#0891b2" opacity="0.1"/>
  
  <!-- Icon: Blueprint/ruler with AI nodes -->
  <rect x="15" y="25" width="30" height="20" stroke="#22d3ee" stroke-width="2" fill="none" rx="2"/>
  
  <!-- Measurement lines -->
  <line x1="18" y1="28" x2="42" y2="28" stroke="#22d3ee" stroke-width="1.5"/>
  <line x1="18" y1="32" x2="35" y2="32" stroke="#22d3ee" stroke-width="1.5"/>
  <line x1="18" y1="36" x2="40" y2="36" stroke="#22d3ee" stroke-width="1.5"/>
  <line x1="18" y1="40" x2="32" y2="40" stroke="#22d3ee" stroke-width="1.5"/>
  
  <!-- AI nodes -->
  <circle cx="20" cy="20" r="2" fill="#0891b2"/>
  <circle cx="40" cy="20" r="2" fill="#0891b2"/>
  <circle cx="20" cy="48" r="2" fill="#0891b2"/>
  <circle cx="40" cy="48" r="2" fill="#0891b2"/>
  
  <!-- Ruler marks -->
  <line x1="15" y1="23" x2="15" y2="25" stroke="#22d3ee" stroke-width="1"/>
  <line x1="22" y1="23" x2="22" y2="25" stroke="#22d3ee" stroke-width="1"/>
  <line x1="30" y1="23" x2="30" y2="25" stroke="#22d3ee" stroke-width="1"/>
  <line x1="38" y1="23" x2="38" y2="25" stroke="#22d3ee" stroke-width="1"/>
  <line x1="45" y1="23" x2="45" y2="25" stroke="#22d3ee" stroke-width="1"/>
  
  <!-- Text: DeepPlanAI -->
  <text x="65" y="28" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#22d3ee">Deep</text>
  <text x="115" y="28" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0891b2">Plan</text>
  <text x="160" y="28" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0891b2">AI</text>
  <text x="65" y="45" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8">AI Takeoffs & Planning</text>
</svg>
