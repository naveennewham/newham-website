<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#gradientHR)" stroke="#06B6D4" stroke-width="2" opacity="0.9"/>

  <!-- Define Gradients -->
  <defs>
    <linearGradient id="gradientHR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#164e63;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0.8" />
    </linearGradient>
  </defs>

  <!-- People Network Icon -->
  <!-- Central Person -->
  <circle cx="100" cy="60" r="12" fill="#06B6D4" opacity="0.9"/>
  <ellipse cx="100" cy="90" rx="14" ry="18" fill="#06B6D4" opacity="0.9"/>

  <!-- Left Person -->
  <circle cx="70" cy="100" r="10" fill="#06B6D4" opacity="0.7"/>
  <ellipse cx="70" cy="125" rx="12" ry="15" fill="#06B6D4" opacity="0.7"/>

  <!-- Right Person -->
  <circle cx="130" cy="100" r="10" fill="#06B6D4" opacity="0.7"/>
  <ellipse cx="130" cy="125" rx="12" ry="15" fill="#06B6D4" opacity="0.7"/>

  <!-- Bottom Left Person -->
  <circle cx="55" cy="145" r="9" fill="#06B6D4" opacity="0.6"/>
  <ellipse cx="55" cy="165" rx="11" ry="13" fill="#06B6D4" opacity="0.6"/>

  <!-- Bottom Right Person -->
  <circle cx="145" cy="145" r="9" fill="#06B6D4" opacity="0.6"/>
  <ellipse cx="145" cy="165" rx="11" ry="13" fill="#06B6D4" opacity="0.6"/>

  <!-- Connection Lines (Network) -->
  <line x1="100" y1="72" x2="70" y2="110" stroke="#00D9FF" stroke-width="1.5" opacity="0.6"/>
  <line x1="100" y1="72" x2="130" y2="110" stroke="#00D9FF" stroke-width="1.5" opacity="0.6"/>
  <line x1="70" y1="115" x2="55" y2="155" stroke="#00D9FF" stroke-width="1.5" opacity="0.6"/>
  <line x1="130" y1="115" x2="145" y2="155" stroke="#00D9FF" stroke-width="1.5" opacity="0.6"/>
  <line x1="70" y1="115" x2="130" y2="115" stroke="#00D9FF" stroke-width="1.5" opacity="0.6"/>
</svg>
