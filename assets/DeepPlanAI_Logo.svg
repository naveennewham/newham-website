<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#gradientAI)" stroke="#06B6D4" stroke-width="2" opacity="0.9"/>

  <!-- Define Gradients -->
  <defs>
    <linearGradient id="gradientAI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0.8" />
    </linearGradient>
  </defs>

  <!-- Blueprint/Grid Background -->
  <g opacity="0.3" stroke="#00D9FF" stroke-width="0.8">
    <line x1="70" y1="60" x2="130" y2="60"/>
    <line x1="70" y1="80" x2="130" y2="80"/>
    <line x1="70" y1="100" x2="130" y2="100"/>
    <line x1="70" y1="120" x2="130" y2="120"/>
    <line x1="70" y1="140" x2="130" y2="140"/>
    <line x1="70" y1="60" x2="70" y2="140"/>
    <line x1="90" y1="60" x2="90" y2="140"/>
    <line x1="110" y1="60" x2="110" y2="140"/>
    <line x1="130" y1="60" x2="130" y2="140"/>
  </g>

  <!-- AI Indicator - Neural Network/Nodes -->
  <!-- Top Node -->
  <circle cx="100" cy="70" r="6" fill="#00D9FF" opacity="0.9"/>
  <!-- Left Node -->
  <circle cx="75" cy="100" r="6" fill="#00D9FF" opacity="0.8"/>
  <!-- Right Node -->
  <circle cx="125" cy="100" r="6" fill="#00D9FF" opacity="0.8"/>
  <!-- Bottom Node -->
  <circle cx="100" cy="130" r="6" fill="#00D9FF" opacity="0.8"/>

  <!-- Connections between nodes -->
  <line x1="100" y1="76" x2="75" y2="94" stroke="#00D9FF" stroke-width="1.5" opacity="0.6"/>
  <line x1="100" y1="76" x2="125" y2="94" stroke="#00D9FF" stroke-width="1.5" opacity="0.6"/>
  <line x1="75" y1="106" x2="100" y2="124" stroke="#00D9FF" stroke-width="1.5" opacity="0.6"/>
  <line x1="125" y1="106" x2="100" y2="124" stroke="#00D9FF" stroke-width="1.5" opacity="0.6"/>

  <!-- Center Measurement/Takeoff Icon -->
  <g opacity="0.7">
    <!-- Ruler/Measurement -->
    <rect x="80" y="85" width="40" height="30" fill="none" stroke="#06B6D4" stroke-width="2"/>
    <!-- Measurement marks -->
    <line x1="85" y1="90" x2="85" y2="115" stroke="#06B6D4" stroke-width="1"/>
    <line x1="95" y1="87" x2="95" y2="118" stroke="#06B6D4" stroke-width="1"/>
    <line x1="105" y1="87" x2="105" y2="118" stroke="#06B6D4" stroke-width="1"/>
    <line x1="115" y1="90" x2="115" y2="115" stroke="#06B6D4" stroke-width="1"/>
  </g>

  <!-- AI Indicator - Sparkle -->
  <circle cx="130" cy="55" r="3.5" fill="#00D9FF" opacity="0.8"/>
  <circle cx="135" cy="62" r="2.5" fill="#00D9FF" opacity="0.6"/>
  <circle cx="142" cy="58" r="2" fill="#00D9FF" opacity="0.5"/>
</svg>
