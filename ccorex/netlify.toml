# Netlify builds this folder as its own site (base directory = this folder).
# Nuxt detects Netlify and builds server routes (sitemap, lead API) as functions.
[build]
  command = "npm run build"
  publish = "dist"
  # Always build. Netlify otherwise skips a site whose folder did not change and reports the
  # skip as a failed deploy (with an email). "exit 1" means "go ahead and build".
  ignore = "exit 1"

[build.environment]
  NODE_VERSION = "24"

# Empty Cloudflare's cache after each production deploy (see the plugin for why).
[[plugins]]
  package = "./netlify/plugins/purge-cloudflare"
  [plugins.inputs]
    zoneId = "5392010581dc29792134f1ffee3ee1dd"
